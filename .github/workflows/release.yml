name: Build and Release

on:
  push:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          echo "VERSION=$(grep -oE '#define APP_VERSION "[^"]+' src/version.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "RELNAME=$(grep -oE '#define APP_RELEASE_NAME "[^"]+' src/version.h | sed 's/#define APP_RELEASE_NAME "//;s/"//' | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{steps.version.outputs.VERSION}}
          name: ${{steps.version.outputs.RELNAME}}
          files: build/Release/*.exe
          token: ${{secrets.GITHUB_TOKEN}}
